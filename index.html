  };

  var answers = new Array(questionsData.length).fill(null);
  var currentQ = 0;

  var quizArea = document.getElementById("quizArea");
  var resultArea = document.getElementById("resultArea");
  var progressBar = document.getElementById("progressBar");

  function renderQuestion(index){
    var item = questionsData[index];
    var html = '<div class="question active">';
    html += '<div class="q-title">' + item.q + '</div>';
    item.options.forEach(function(opt, i){
      var selected = answers[index] === i ? " selected" : "";
      html += '<button type="button" class="option' + selected + '" data-index="' + i + '">' + opt.text + '</button>';
    });
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn btn-prev"' + (index === 0 ? ' disabled' : '') + '>上一题</button>';
    html += '<button type="button" class="btn btn-next"' + (answers[index] === null ? ' disabled' : '') + '>' + (index === questionsData.length - 1 ? '查看结果' : '下一题') + '</button>';
    html += '</div></div>';
    quizArea.innerHTML = html;

    var optionBtns = quizArea.querySelectorAll(".option");
    optionBtns.forEach(function(btn){
      btn.addEventListener("click", function(){
        optionBtns.forEach(function(b){ b.classList.remove("selected"); });
        btn.classList.add("selected");
        answers[index] = parseInt(btn.getAttribute("data-index"), 10);
        quizArea.querySelector(".btn-next").disabled = false;
      });
    });

    quizArea.querySelector(".btn-prev").addEventListener("click", function(){
      if(index > 0){
        currentQ = index - 1;
        renderQuestion(currentQ);
      }
    });

    quizArea.querySelector(".btn-next").addEventListener("click", function(){
      if(answers[index] === null) return;
      if(index < questionsData.length - 1){
        currentQ = index + 1;
        renderQuestion(currentQ);
      }else{
        showResult();
      }
    });

    updateProgress();
  }

  function updateProgress(){
    var percent = (currentQ / questionsData.length) * 100;
    progressBar.style.width = percent + "%";
  }

  function calculateScores(){
    var scores = {};
    Object.keys(profiles).forEach(function(k){ scores[k] = 0; });

    answers.forEach(function(optIndex, qIndex){
      if(optIndex === null) return;
      var opt = questionsData[qIndex].options[optIndex];
      if(!opt || !opt.weights) return;
      Object.keys(opt.weights).forEach(function(personKey){
        if(scores[personKey] === undefined) scores[personKey] = 0;
        scores[personKey] += opt.weights[personKey];
      });
    });
    return scores;
  }

  function pickProfile(){
    var scores = calculateScores();
    var bestScore = -1;
    var topKeys = [];

    Object.keys(scores).forEach(function(k){
      if(scores[k] > bestScore){
        bestScore = scores[k];
        topKeys = [k];
      }else if(scores[k] === bestScore){
        topKeys.push(k);
      }
    });

    var bestKey = topKeys[Math.floor(Math.random() * topKeys.length)];
    return profiles[bestKey] || profiles.zhuzhixin;
  }

  function showResult(){
    var p = pickProfile();
    resultArea.innerHTML =
      '<div class="badge">测试结果</div>' +
      '<div class="result-title">测试完毕，你是sdfj的' + p.name + '</div>' +
      '<div class="keywords">' + p.keywords + '</div>' +
      '<div class="section"><h3>人格标签</h3><p>' + p.tag + '</p></div>' +
      '<div class="section"><h3>你像他的地方</h3><p>' + p.good + '</p></div>' +
      '<div class="section"><h3>你的缺点</h3><p>' + p.bad + '</p></div>' +
      '<div class="section"><h3>最适合你的sdfj瞬间</h3><p>' + p.moment + '</p></div>' +
      '<button type="button" class="restart" id="restartBtn">重新测试</button>';

    quizArea.style.display = "none";
    resultArea.classList.add("active");
    progressBar.style.width = "100%";

    document.getElementById("restartBtn").addEventListener("click", function(){
      answers = new Array(questionsData.length).fill(null);
      currentQ = 0;
      resultArea.classList.remove("active");
      resultArea.innerHTML = "";
      quizArea.style.display = "block";
      renderQuestion(0);
    });
  }

  renderQuestion(0);
})();
